<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-edit-loop-title agent-edit-loop-desc" id="agent-edit-loop-root">
        <title id="agent-edit-loop-title">An agent edits a token and gets stopped</title>
        <desc id="agent-edit-loop-desc">Sequence diagram: an AI agent reads a component spec from the MCP server, then tries to update a token; the store writes and re-checks contrast, three pairs fail, the file is restored and the agent receives a 422 listing the failing pairs.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #agent-edit-loop-root { --color-paper:  #f4f5f7;
      --color-ink:    #1c2028;
      --color-muted:  #4b5260;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace; }
      #agent-edit-loop-root { font-family: var(--font-sans); color: var(--color-ink); }
      #agent-edit-loop-root .diagram-container { width: 100%; overflow-x: auto; }
      #agent-edit-loop-root .caption { font-family: var(--font-serif); font-style: italic; font-size: 1.05rem; color: var(--color-muted); max-width: 60ch; margin-bottom: 1.5rem; }
      @media print {
#agent-edit-loop-root .diagram-container { overflow-x: visible; }
}</style>
