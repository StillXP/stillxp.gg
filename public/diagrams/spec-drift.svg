<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 484" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="spec-drift-title spec-drift-desc" id="spec-drift-root">
        <title id="spec-drift-title">One spec, checked against both codebases</title>
        <desc id="spec-drift-desc">A component spec JSON file feeds the Figma props map and the get_component tool. A check script reads the React and React Native prop types with the TypeScript compiler API, compares them with the spec and fails the build on drift.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #spec-drift-root { --color-paper:  #f4f5f7;
      --color-ink:    #1c2028;
      --color-muted:  #4b5260;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace; }
      #spec-drift-root { font-family: var(--font-sans); color: var(--color-ink); }
      #spec-drift-root .diagram-container { width: 100%; overflow-x: auto; }
      #spec-drift-root .caption { font-family: var(--font-serif); font-style: italic; font-size: 1.05rem; color: var(--color-muted); max-width: 60ch; margin-bottom: 1.5rem; }
      @media print {
#spec-drift-root .diagram-container { overflow-x: visible; }
}</style>
